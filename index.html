<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写真報告書">
<meta name="theme-color" content="#1f3b4d">
<title>写真報告書</title>
<!-- ExcelJS 4.4.0（同梱版。SHA-256: 7E49DA68588E250DBB8BBA190D2CAA8AB3787CC0284BDA1D8B2F805C4DF742C9） -->
<script src="exceljs.min.js" defer></script>
<style>
  :root { --main:#1f3b4d; --accent:#2f7d5b; --bg:#f2f4f6; --line:#d5dbe1; --text:#1d2329; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
         -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff;
           padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .count { font-size:13px; opacity:.85; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:6px 10px; font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:12px 12px 120px; }
  section, details { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  details summary { font-weight:600; cursor:pointer; padding:2px 0; }
  h2 { font-size:15px; margin:0 0 8px; }
  label { display:block; font-size:12px; color:#56616b; margin-top:8px; }
  input[type=text], input[type=date], textarea { display:block; width:100%; margin-top:3px; font-size:16px; padding:9px 10px;
         border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); font-family:inherit; }
  textarea { resize:vertical; line-height:1.5; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); }
  .chk input { width:20px; height:20px; }
  .note-s { font-size:11px; color:#7a858f; margin:6px 0 0; }

  .card { background:#fff; border-radius:12px; padding:10px 12px 12px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .card-head .num { font-weight:700; font-size:15px; }
  .card-head .pg { font-size:12px; color:#7a858f; }
  .card-head .spacer { flex:1; }
  .ic { width:38px; height:34px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:16px; color:var(--text); }
  .ic.del { color:#c0392b; }
  .thumb { position:relative; background:#e6e9ec; border-radius:8px; overflow:hidden; text-align:center; min-height:120px; cursor:pointer; }
  .thumb img { display:block; width:100%; height:auto; }
  .thumb .hint { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; padding:3px 7px; border-radius:6px; }
  .chips { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .chips button { border:1px solid var(--line); background:#f7f9fa; border-radius:16px; padding:5px 12px; font-size:13px; color:var(--text); }
  .empty { text-align:center; color:#7a858f; padding:40px 10px; font-size:14px; line-height:1.8; }

  .bar { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line);
         padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); display:flex; gap:8px; justify-content:center; }
  .bar button { flex:1; max-width:220px; font-size:15px; padding:12px 6px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); font-weight:600; }
  .bar .cam { background:var(--accent); color:#fff; border-color:var(--accent); flex:1.4; }
  .primary { background:var(--main) !important; color:#fff !important; border-color:var(--main) !important; }

  .modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:12px; }
  .modal[hidden] { display:none; }
  .modal-body { background:#fff; border-radius:14px; padding:12px; width:100%; max-width:900px; max-height:100%; overflow:auto; }
  .modal-body.small { max-width:420px; }
  .modal-body h3 { margin:4px 0 8px; font-size:17px; }
  .modal-body p { font-size:14px; line-height:1.6; margin:0 0 12px; word-break:break-all; }
  #edCanvas { display:block; width:100%; height:auto; max-height:65vh; object-fit:contain; touch-action:none; background:#222; border-radius:8px; }
  .ed-ctl { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; }
  .ed-ctl label { margin:0; display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); }
  .ed-ctl input[type=range] { width:150px; }
  .ed-ctl .sp { flex:1; }
  .btn { font-size:15px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row .btn { flex:1; }
  .menu button { display:block; width:100%; text-align:left; margin-bottom:8px; }
  .menu .desc { display:block; font-size:12px; color:#7a858f; margin-top:2px; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(20,20,20,.88); color:#fff; padding:10px 16px;
           border-radius:10px; font-size:14px; z-index:30; max-width:90vw; display:none; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; font-size:16px; font-weight:600; }

  /* ===== 印刷（PDF）用レイアウト：Excelの報告書と同じ並び ===== */
  #print { display:none; }
  @media print {
    @page { size:A4 portrait; margin:10mm 10mm 10mm 20mm; }
    body { background:#fff; }
    body > :not(#print) { display:none !important; }
    #print { display:block; }
    .page { width:180mm; height:276mm; display:flex; flex-direction:column; gap:3mm; overflow:hidden; break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    .blk { display:flex; gap:2.5mm; height:88mm; }
    .ph { width:122mm; height:88mm; border:0.3mm dashed #888; display:flex; align-items:center; justify-content:center; }
    .ph img { max-width:119mm; max-height:85mm; }
    .tx { flex:1; height:88mm; display:grid; grid-template-rows:1.79fr repeat(9, 1fr); border:0.3mm solid #888; }
    .tx div { display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; white-space:nowrap;
              border-top:0.2mm solid #bbb; font-family:"Hiragino Kaku Gothic ProN","MS PGothic","Yu Gothic",sans-serif; font-size:9pt; padding:0 1mm; }
    .tx .t1 { font-size:12pt; white-space:normal; border-top:none; }
    .tx .t2 { font-size:10.5pt; border-top:0.3mm solid #888; }
  }
</style>
</head>
<body>
<header>
  <h1>写真報告書</h1>
  <span class="count" id="count"></span>
  <button id="btnNew">新規</button>
</header>

<main>
  <section>
    <h2>報告書の情報</h2>
    <label>作業名<input type="text" id="mTitle" placeholder="例：差圧計交換作業"></label>
    <div class="grid2">
      <label>日付<input type="date" id="mDate"></label>
      <label>場所（最初の写真に入る値）<input type="text" id="mLoc" placeholder="例：408室スクラバー"></label>
    </div>
    <p class="note-s">場所は直前の写真と同じ値が次の写真にも入ります。写真ごとに書き換えられます。</p>
  </section>

  <details id="boardSec">
    <summary>電子黒板の設定</summary>
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="bUse"> 写真に黒板を入れる</label>
    <div class="grid2">
      <label>工事名<input type="text" id="bKoji" placeholder="例：○○ビル 空調設備保守"></label>
      <label>施工者<input type="text" id="bSekou" placeholder="例：○○設備(株)"></label>
    </div>
    <p class="note-s">黒板には「工事名・作業内容（作業名）・場所・備考・日付・施工者」のうち、入力した項目だけが表示されます。位置と大きさは写真をタップして調整できます。</p>
  </details>

  <div id="list"></div>
  <div class="empty" id="empty">まだ写真がありません。<br>下の「撮影」で写真を撮ると、ここに報告書の枠が追加されます。<br>1ページに3枚ずつ並びます。</div>
</main>

<div class="bar">
  <button class="cam" id="btnCam">📷 撮影</button>
  <button id="btnLib">🖼 写真を選ぶ</button>
  <button id="btnOut">⬆ 出力</button>
</div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>

<template id="cardTpl">
  <div class="card">
    <div class="card-head">
      <span class="num"></span><span class="pg"></span><span class="spacer"></span>
      <button class="ic up" title="上へ">↑</button>
      <button class="ic down" title="下へ">↓</button>
      <button class="ic rot" title="90度回転">⟳</button>
      <button class="ic del" title="削除">✕</button>
    </div>
    <div class="thumb"><img alt=""><span class="hint">タップで黒板を調整</span></div>
    <label>場所<input type="text" class="loc"></label>
    <label>説明（改行で行が分かれます・7行まで）<textarea class="desc" rows="4" placeholder="例：古いチューブの取外し&#10;※差圧計のH側、L側で各1本"></textarea></label>
    <label class="noteWrap">黒板の備考<input type="text" class="note" placeholder="例：施工前"></label>
    <div class="chips noteWrap"><button>施工前</button><button>施工中</button><button>施工後</button><button data-clear>クリア</button></div>
  </div>
</template>

<div class="modal" id="editor" hidden>
  <div class="modal-body">
    <canvas id="edCanvas"></canvas>
    <p class="note-s">黒板をドラッグして移動できます。写真の別の場所をタップするとそこへ移動します。</p>
    <div class="ed-ctl">
      <label><input type="checkbox" id="edOn"> 黒板を表示</label>
      <label>大きさ <input type="range" id="edSize" min="0.2" max="0.8" step="0.01"></label>
      <button class="btn" id="edReset">左下に戻す</button>
      <span class="sp"></span>
      <button class="btn primary" id="edClose">完了</button>
    </div>
  </div>
</div>

<div class="modal" id="outMenu" hidden>
  <div class="modal-body small menu">
    <h3>出力</h3>
    <button class="btn" id="outXlsx">📊 Excelファイル（.xlsx）<span class="desc">今の報告書と同じレイアウト。あとで編集できます（Googleスプレッドシートでも開けます）</span></button>
    <button class="btn" id="outPdf">📄 PDF（印刷画面から保存）<span class="desc">編集が要らないときはこちらで直接PDFにできます</span></button>
    <button class="btn" id="outCancel">閉じる</button>
  </div>
</div>

<div class="modal" id="ready" hidden>
  <div class="modal-body small">
    <h3 id="readyTitle"></h3>
    <p id="readyMsg"></p>
    <div class="row">
      <button class="btn primary" id="readyMain"></button>
      <button class="btn" id="readyDl">ダウンロード</button>
      <button class="btn" id="readyClose">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="busy">作成中…</div>
<div id="print"></div>

<script>
'use strict';
/* ================= 基本 ================= */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const jpDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${y}年${m}月${d}日`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const DESC_LINES = 7;           // Excelの説明欄（場所の下）の行数
const PER_PAGE = 3;

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function busy(on, msg = '作成中…') { const b = $('#busy'); b.textContent = msg; b.style.display = on ? 'flex' : 'none'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ================= 保存（端末内のみ） ================= */
const META_KEY = 'photoReport.meta.v1';
const defaultMeta = () => ({ title: '', date: todayStr(), defLoc: '', board: { use: true, koji: '', sekou: '' } });
function loadMeta() {
  try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m) return Object.assign(defaultMeta(), m, { board: Object.assign(defaultMeta().board, m.board) }); } catch (e) {}
  return defaultMeta();
}
let meta = loadMeta();
const saveMeta = () => localStorage.setItem(META_KEY, JSON.stringify(meta));

let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('photoReport', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('photos', mode); const req = fn(t.objectStore('photos')); let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbPut = p => tx('readwrite', s => s.put(p));
const dbDel = id => tx('readwrite', s => s.delete(id));
const dbClear = () => tx('readwrite', s => s.clear());

let photos = [];
const saveLater = new Map();
function savePhoto(p) {
  clearTimeout(saveLater.get(p.id));
  saveLater.set(p.id, setTimeout(() => dbPut(p).catch(e => toast('保存に失敗しました: ' + e.message)), 300));
}

/* ================= 画像 ================= */
const imgCache = new Map();
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を開けません')); i.src = src; });
}
async function getImg(p) {
  if (!imgCache.has(p.id)) imgCache.set(p.id, loadImg(URL.createObjectURL(p.blob)));
  return imgCache.get(p.id);
}
// 撮影画像を長辺1800pxのJPEGに縮小して保存（向きはブラウザが補正）
async function normalizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const MAX = 1800;
    const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}

/* ================= 電子黒板 ================= */
const BOARD_FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
function boardRows(p) {
  return [
    ['工事名', meta.board.koji], ['作業内容', meta.title], ['場所', p.loc],
    ['備考', p.note], ['日付', jpDate(meta.date)], ['施工者', meta.board.sekou],
  ].filter(r => r[1] && String(r[1]).trim());
}
function boardRect(p, W, H) {
  const n = Math.max(1, boardRows(p).length);
  const bw = Math.min(W * 0.96, p.board.s * Math.min(W, H) * 1.2);
  const rh = bw * 0.12, bh = Math.min(H * 0.96, n * rh);
  const x = p.board.x == null ? W * 0.02 : clamp(p.board.x * W, 0, W - bw);
  const y = p.board.y == null ? H - bh - H * 0.02 : clamp(p.board.y * H, 0, H - bh);
  return { x, y, w: bw, h: bh, rh: bh / n };
}
function fitText(g, t, x, y, maxW, size, align) {
  let s = size; g.font = `600 ${s}px ${BOARD_FONT}`;
  let m = g.measureText(t).width;
  if (m > maxW) { s = Math.max(size * 0.5, s * maxW / m); g.font = `600 ${s}px ${BOARD_FONT}`; m = g.measureText(t).width; }
  g.textAlign = align;
  if (m > maxW) { g.save(); g.translate(x, y); g.scale(maxW / m, 1); g.fillText(t, 0, 0); g.restore(); }
  else g.fillText(t, x, y);
}
function drawBoard(g, W, H, p) {
  const rows = boardRows(p); if (!rows.length) return;
  const r = boardRect(p, W, H);
  g.save();
  g.fillStyle = '#24493b'; g.fillRect(r.x, r.y, r.w, r.h);
  const lw = Math.max(1.5, r.w * 0.008);
  g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = lw;
  g.strokeRect(r.x + lw / 2, r.y + lw / 2, r.w - lw, r.h - lw);
  const lab = r.w * 0.26;
  g.lineWidth = Math.max(1, lw * 0.55);
  g.beginPath(); g.moveTo(r.x + lab, r.y); g.lineTo(r.x + lab, r.y + r.h);
  for (let i = 1; i < rows.length; i++) { g.moveTo(r.x, r.y + i * r.rh); g.lineTo(r.x + r.w, r.y + i * r.rh); }
  g.stroke();
  g.fillStyle = '#fff'; g.textBaseline = 'middle';
  rows.forEach(([k, v], i) => {
    const cy = r.y + i * r.rh + r.rh / 2;
    fitText(g, k, r.x + lab / 2, cy, lab * 0.84, r.rh * 0.46, 'center');
    fitText(g, String(v), r.x + lab + r.rh * 0.25, cy, r.w - lab - r.rh * 0.5, r.rh * 0.52, 'left');
  });
  g.restore();
}
// 回転・黒板を反映した完成画像
function composeSync(img, p, maxSide) {
  const rot = p.rot || 0, sw = img.naturalWidth, sh = img.naturalHeight;
  const W = rot % 180 ? sh : sw, H = rot % 180 ? sw : sh;
  const k = maxSide ? Math.min(1, maxSide / Math.max(W, H)) : 1;
  const cw = Math.round(W * k), ch = Math.round(H * k);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  g.save(); g.translate(cw / 2, ch / 2); g.rotate(rot * Math.PI / 180);
  const dw = rot % 180 ? ch : cw, dh = rot % 180 ? cw : ch;
  g.drawImage(img, -dw / 2, -dh / 2, dw, dh); g.restore();
  if (meta.board.use && p.board.on) drawBoard(g, cw, ch, p);
  return c;
}
async function compose(p, maxSide) { return composeSync(await getImg(p), p, maxSide); }

/* ================= 一覧 ================= */
const cardOf = new Map();
function updateCount() {
  const n = photos.length;
  $('#count').textContent = n ? `${n}枚 / ${Math.ceil(n / PER_PAGE)}ページ` : '';
  $('#empty').style.display = n ? 'none' : 'block';
  photos.forEach((p, i) => {
    const c = cardOf.get(p.id); if (!c) return;
    c.querySelector('.num').textContent = `No.${i + 1}`;
    c.querySelector('.pg').textContent = `（${Math.floor(i / PER_PAGE) + 1}ページ目）`;
  });
}
async function updateThumb(p) {
  const c = cardOf.get(p.id); if (!c) return;
  const cv = await compose(p, 900);
  cv.toBlob(b => {
    const img = c.querySelector('.thumb img');
    if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    img.dataset.url = URL.createObjectURL(b); img.src = img.dataset.url;
  }, 'image/jpeg', 0.8);
}
const refreshAllThumbs = debounce(() => photos.forEach(updateThumb), 400);
function applyBoardVisibility() {
  document.querySelectorAll('.noteWrap').forEach(e => e.style.display = meta.board.use ? '' : 'none');
}
function makeCard(p) {
  const c = $('#cardTpl').content.firstElementChild.cloneNode(true);
  cardOf.set(p.id, c);
  const thumbLater = debounce(() => updateThumb(p), 400);
  const loc = c.querySelector('.loc'), desc = c.querySelector('.desc'), note = c.querySelector('.note');
  loc.value = p.loc || ''; desc.value = p.desc || ''; note.value = p.note || '';
  loc.addEventListener('input', () => { p.loc = loc.value; savePhoto(p); thumbLater(); });
  desc.addEventListener('input', () => { p.desc = desc.value; savePhoto(p); });
  note.addEventListener('input', () => { p.note = note.value; savePhoto(p); thumbLater(); });
  c.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => {
    note.value = b.hasAttribute('data-clear') ? '' : b.textContent; p.note = note.value; savePhoto(p); updateThumb(p);
  }));
  c.querySelector('.thumb').addEventListener('click', () => openEditor(p));
  c.querySelector('.up').addEventListener('click', () => move(p, -1));
  c.querySelector('.down').addEventListener('click', () => move(p, 1));
  c.querySelector('.rot').addEventListener('click', () => { p.rot = ((p.rot || 0) + 90) % 360; p.board.x = p.board.y = null; savePhoto(p); updateThumb(p); });
  c.querySelector('.del').addEventListener('click', async () => {
    if (!confirm('この写真を報告書から削除しますか？')) return;
    photos = photos.filter(x => x !== p); cardOf.delete(p.id); c.remove(); imgCache.delete(p.id);
    await dbDel(p.id); renumber(); updateCount();
  });
  c.querySelectorAll('.noteWrap').forEach(e => e.style.display = meta.board.use ? '' : 'none');
  updateThumb(p);
  return c;
}
function renumber() { photos.forEach((p, i) => { if (p.order !== i) { p.order = i; savePhoto(p); } }); }
function move(p, d) {
  const i = photos.indexOf(p), j = i + d; if (j < 0 || j >= photos.length) return;
  [photos[i], photos[j]] = [photos[j], photos[i]];
  const list = $('#list'), a = cardOf.get(photos[i].id), b = cardOf.get(photos[j].id);
  if (d < 0) list.insertBefore(b, a); else list.insertBefore(a, b.nextSibling);
  renumber(); updateCount(); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
async function addFiles(files) {
  let added = 0;
  for (const f of files) {
    try {
      const { blob, w, h } = await normalizeImage(f);
      const last = photos[photos.length - 1];
      const p = { id: uid(), order: photos.length, blob, w, h, rot: 0,
                  loc: last ? last.loc : meta.defLoc, desc: '', note: '',
                  board: { on: true, x: null, y: null, s: 0.42 } };
      photos.push(p); await dbPut(p);
      const c = makeCard(p); $('#list').appendChild(c); added++;
    } catch (e) { toast('写真を読み込めませんでした: ' + e.message); }
  }
  updateCount();
  if (added) { const last = cardOf.get(photos[photos.length - 1].id); setTimeout(() => last.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100); }
}
window.addFiles = addFiles; // 動作確認用

/* ================= 黒板の位置調整 ================= */
let edP = null, edImg = null, drag = null;
async function openEditor(p) {
  edP = p; edImg = await getImg(p);
  $('#edOn').checked = p.board.on; $('#edOn').disabled = !meta.board.use;
  $('#edSize').value = p.board.s;
  $('#editor').hidden = false; drawEditor();
  if (!meta.board.use) toast('電子黒板の設定で「写真に黒板を入れる」がオフです');
}
function drawEditor() {
  const src = composeSync(edImg, edP, 1400), cv = $('#edCanvas');
  cv.width = src.width; cv.height = src.height; cv.getContext('2d').drawImage(src, 0, 0);
}
function canvasPt(e) {
  const cv = $('#edCanvas'), r = cv.getBoundingClientRect();
  // object-fit:contain の余白を考慮
  const s = Math.min(r.width / cv.width, r.height / cv.height);
  const ox = (r.width - cv.width * s) / 2, oy = (r.height - cv.height * s) / 2;
  return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s, W: cv.width, H: cv.height };
}
function setBoardPos(pt, dx, dy) {
  const r = boardRect(edP, pt.W, pt.H);
  edP.board.x = clamp(pt.x - dx, 0, pt.W - r.w) / pt.W;
  edP.board.y = clamp(pt.y - dy, 0, pt.H - r.h) / pt.H;
  drawEditor();
}
$('#edCanvas').addEventListener('pointerdown', e => {
  if (!meta.board.use || !edP.board.on) return;
  const pt = canvasPt(e), r = boardRect(edP, pt.W, pt.H);
  const inside = pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
  drag = inside ? { dx: pt.x - r.x, dy: pt.y - r.y } : { dx: r.w / 2, dy: r.h / 2 };
  e.target.setPointerCapture(e.pointerId); setBoardPos(pt, drag.dx, drag.dy);
});
$('#edCanvas').addEventListener('pointermove', e => { if (drag) setBoardPos(canvasPt(e), drag.dx, drag.dy); });
['pointerup', 'pointercancel'].forEach(t => $('#edCanvas').addEventListener(t, () => { drag = null; }));
$('#edOn').addEventListener('change', e => { edP.board.on = e.target.checked; drawEditor(); });
$('#edSize').addEventListener('input', e => { edP.board.s = +e.target.value; drawEditor(); });
$('#edReset').addEventListener('click', () => { edP.board.x = edP.board.y = null; drawEditor(); });
$('#edClose').addEventListener('click', () => { $('#editor').hidden = true; savePhoto(edP); updateThumb(edP); edP = null; });

/* ================= Excel出力 ================= */
function chunk(a, n) { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; }
function descLines(p) {
  const ls = (p.desc || '').split(/\r?\n/);
  if (ls.length > DESC_LINES) ls.splice(DESC_LINES - 1, ls.length, ls.slice(DESC_LINES - 1).join(' '));
  while (ls.length < DESC_LINES) ls.push('');
  return ls;
}
async function buildXlsx() {
  if (!window.ExcelJS) throw new Error('Excel出力の部品（exceljs.min.js）を読み込めていません。アプリを開き直してください。');
  const wb = new ExcelJS.Workbook(); wb.creator = '写真報告書アプリ'; wb.created = new Date();
  const gray = { argb: 'FF808080' };
  const thin = { style: 'thin', color: gray }, hair = { style: 'hair', color: gray }, dashed = { style: 'dashed', color: gray };
  const COL_PX = 187.5, BOX_W = COL_PX * 3;                // B〜D列（幅25）×3 ※Excel実測値
  const ROW_PX = [75, 42, 42, 42, 42, 42, 42, 42, 42, 42]; // 56.25pt + 31.5pt×9
  const BOX_H = ROW_PX.reduce((a, b) => a + b, 0);
  const [yy, mm, dd] = (meta.date || todayStr()).split('-').map(Number);
  const pages = chunk(photos, PER_PAGE);
  for (let pi = 0; pi < pages.length; pi++) {
    const ws = wb.addWorksheet(pad2(pi + 1), {
      views: [{ showGridLines: false }],
      pageSetup: { paperSize: 9, orientation: 'portrait', scale: 75, printArea: 'B2:F33',
                   margins: { left: 0.787, right: 0.394, top: 0.394, bottom: 0.394, header: 0.512, footer: 0.512 } },
    });
    [[1, 2.6], [2, 25], [3, 25], [4, 25], [5, 2.13], [6, 33.86], [7, 1.86], [8, 3.73]].forEach(([c, w]) => { ws.getColumn(c).width = w; });
    ws.getRow(1).height = 13.5;
    for (let b = 0; b < PER_PAGE; b++) {
      const top = 2 + b * 11, p = pages[pi][b];
      ws.getRow(top).height = 56.25;
      for (let r = top + 1; r <= top + 9; r++) ws.getRow(r).height = 31.5;
      if (b < PER_PAGE - 1) ws.getRow(top + 10).height = 12;
      // 写真枠（結合＋点線）
      ws.mergeCells(top, 2, top + 9, 4);
      for (let r = top; r <= top + 9; r++) for (let c = 2; c <= 4; c++) {
        const bd = {};
        if (r === top) bd.top = dashed; if (r === top + 9) bd.bottom = dashed;
        if (c === 2) bd.left = dashed; if (c === 4) bd.right = dashed;
        ws.getCell(r, c).style = { border: bd };
      }
      // 右側の文字欄
      const F = r => ws.getCell(r, 6);
      F(top).value = p ? meta.title : null;
      F(top).style = { font: { name: 'ＭＳ Ｐゴシック', size: 16 }, alignment: { horizontal: 'center', vertical: 'middle', wrapText: true },
                       border: { top: thin, left: thin, right: thin, bottom: thin } };
      F(top + 1).value = p && meta.date ? new Date(Date.UTC(yy, mm - 1, dd)) : null;
      F(top + 1).style = { numFmt: 'yyyy"年"m"月"d"日"', font: { name: 'ＭＳ Ｐゴシック', size: 14 },
                           alignment: { horizontal: 'center', vertical: 'middle', shrinkToFit: true },
                           border: { top: thin, left: thin, right: thin, bottom: hair } };
      const lines = p ? [p.loc || '', ...descLines(p)] : Array(DESC_LINES + 1).fill('');
      lines.forEach((t, i) => {
        const r = top + 2 + i;
        F(r).value = t || null;
        F(r).style = { font: { name: 'ＭＳ Ｐゴシック', size: 12 }, alignment: { horizontal: 'center', vertical: 'middle', shrinkToFit: true },
                       border: { left: thin, right: thin, top: hair, bottom: r === top + 9 ? thin : hair } };
      });
      // 写真（枠の中央に収める）
      if (p) {
        const cv = await compose(p, 1600);
        const id = wb.addImage({ base64: cv.toDataURL('image/jpeg', 0.85), extension: 'jpeg' });
        const k = Math.min((BOX_W - 16) / cv.width, (BOX_H - 16) / cv.height);
        const w = Math.round(cv.width * k), h = Math.round(cv.height * k);
        const offX = (BOX_W - w) / 2, offY = (BOX_H - h) / 2;
        const ci = Math.floor(offX / COL_PX);
        let ri = 0, acc = 0; while (ri < 9 && acc + ROW_PX[ri] <= offY) { acc += ROW_PX[ri]; ri++; }
        ws.addImage(id, {
          tl: { nativeCol: 1 + ci, nativeColOff: Math.round((offX - ci * COL_PX) * 9525),
                nativeRow: top - 1 + ri, nativeRowOff: Math.round((offY - acc) * 9525) },
          ext: { width: w, height: h }, editAs: 'oneCell',
        });
      }
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: XLSX_MIME });
}
window.buildXlsx = buildXlsx; // 動作確認用

function fileBaseName() {
  const d = (meta.date || todayStr()).replace(/-/g, '');
  const t = (meta.title || '写真報告書').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
  return `${d}_${t}`;
}

/* ================= PDF（印刷） ================= */
async function buildPrint() {
  const root = $('#print'); root.innerHTML = '';
  const imgs = [];
  for (const pg of chunk(photos, PER_PAGE)) {
    const page = document.createElement('div'); page.className = 'page';
    for (let b = 0; b < PER_PAGE; b++) {
      const p = pg[b];
      const blk = document.createElement('div'); blk.className = 'blk';
      const ph = document.createElement('div'); ph.className = 'ph';
      const tx = document.createElement('div'); tx.className = 'tx';
      if (p) {
        const im = document.createElement('img'); im.src = (await compose(p, 1400)).toDataURL('image/jpeg', 0.85);
        ph.appendChild(im); imgs.push(im);
      }
      const cells = [p ? meta.title : '', p ? jpDate(meta.date) : '', ...(p ? [p.loc || '', ...descLines(p)] : Array(DESC_LINES + 1).fill(''))];
      cells.forEach((t, i) => { const d = document.createElement('div'); if (i === 0) d.className = 't1'; if (i === 1) d.className = 't2'; d.textContent = t; tx.appendChild(d); });
      blk.append(ph, tx); page.appendChild(blk);
    }
    root.appendChild(page);
  }
  await Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : null));
}

/* ================= 出力ダイアログ ================= */
let readyFile = null;
function showReady(title, msg, mainLabel, onMain, file) {
  readyFile = file;
  $('#readyTitle').textContent = title; $('#readyMsg').textContent = msg;
  $('#readyMain').textContent = mainLabel; $('#readyMain').onclick = onMain;
  $('#readyDl').style.display = file ? '' : 'none';
  $('#ready').hidden = false;
}
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function shareFile(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); }
    catch (e) { if (e.name !== 'AbortError') { toast('共有できなかったのでダウンロードします'); download(file); } }
  } else download(file);
}
$('#btnOut').addEventListener('click', () => {
  if (!photos.length) return toast('写真がまだありません');
  $('#outMenu').hidden = false;
});
$('#outCancel').addEventListener('click', () => { $('#outMenu').hidden = true; });
$('#outXlsx').addEventListener('click', async () => {
  $('#outMenu').hidden = true; busy(true, 'Excelを作成中…');
  try {
    const blob = await buildXlsx();
    const file = new File([blob], fileBaseName() + '.xlsx', { type: XLSX_MIME });
    busy(false);
    showReady('Excelができました', `${file.name}（${(file.size / 1024 / 1024).toFixed(1)}MB）`,
      '共有・保存', () => shareFile(file), file);
  } catch (e) { busy(false); alert('Excelの作成に失敗しました。\n' + e.message); }
});
$('#outPdf').addEventListener('click', async () => {
  $('#outMenu').hidden = true; busy(true, 'PDF用の画面を準備中…');
  try {
    await buildPrint(); busy(false);
    showReady('PDFの準備ができました', '「印刷」を押し、印刷画面の共有ボタン（iPhone/iPad）または「PDFに保存」（パソコン）で保存してください。',
      '印刷 / PDF保存', () => { $('#ready').hidden = true; window.print(); }, null);
  } catch (e) { busy(false); alert('PDFの準備に失敗しました。\n' + e.message); }
});
$('#readyDl').addEventListener('click', () => readyFile && download(readyFile));
$('#readyClose').addEventListener('click', () => { $('#ready').hidden = true; });

/* ================= 画面の入力 ================= */
function bindMeta() {
  const map = [['#mTitle', 'title', true], ['#mDate', 'date', true], ['#mLoc', 'defLoc', false]];
  map.forEach(([sel, key, affectsBoard]) => {
    const el = $(sel); el.value = meta[key] || '';
    el.addEventListener('input', () => { meta[key] = el.value; saveMeta(); if (affectsBoard) refreshAllThumbs(); });
  });
  [['#bKoji', 'koji'], ['#bSekou', 'sekou']].forEach(([sel, key]) => {
    const el = $(sel); el.value = meta.board[key] || '';
    el.addEventListener('input', () => { meta.board[key] = el.value; saveMeta(); refreshAllThumbs(); });
  });
  $('#bUse').checked = meta.board.use;
  $('#bUse').addEventListener('change', e => { meta.board.use = e.target.checked; saveMeta(); applyBoardVisibility(); refreshAllThumbs(); });
}
$('#btnCam').addEventListener('click', () => $('#camIn').click());
$('#btnLib').addEventListener('click', () => $('#libIn').click());
['#camIn', '#libIn'].forEach(s => $(s).addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) { busy(true, '写真を取り込み中…'); try { await addFiles(files); } finally { busy(false); } }
}));
$('#btnNew').addEventListener('click', async () => {
  if (!confirm('今の写真と入力内容を消して、新しい報告書を始めますか？\n（工事名・施工者の設定は残ります）')) return;
  await dbClear(); photos = []; cardOf.clear(); imgCache.clear(); $('#list').innerHTML = '';
  meta = Object.assign(defaultMeta(), { board: meta.board }); saveMeta();
  $('#mTitle').value = ''; $('#mDate').value = meta.date; $('#mLoc').value = '';
  updateCount(); window.scrollTo(0, 0);
});

/* ================= 起動 ================= */
(async function init() {
  bindMeta();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try {
    photos = (await dbAll()).sort((a, b) => a.order - b.order);
    photos.forEach(p => $('#list').appendChild(makeCard(p)));
  } catch (e) { toast('保存データを読めませんでした: ' + e.message); }
  updateCount();
})();
</script>
