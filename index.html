<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写真報告書">
<meta name="theme-color" content="#1f3b4d">
<title>写真報告書</title>
<style>
  :root { --main:#1f3b4d; --accent:#2f7d5b; --bg:#e9edf0; --line:#d5dbe1; --text:#1d2329; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
         -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff;
           padding:calc(env(safe-area-inset-top) + 10px) 12px 10px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .count { font-size:13px; opacity:.85; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); border-radius:8px; padding:7px 12px; font-size:14px; font-weight:600; }
  main { max-width:780px; margin:0 auto; padding:8px 10px 110px; }
  .guide { font-size:12.5px; color:#4a5560; text-align:center; margin:2px 0 8px; line-height:1.5; }
  .pcap { font-size:13px; font-weight:700; color:#4a5560; margin:14px 2px 5px; }
  .pcap .sub { font-weight:400; color:#7a858f; }
  .sheet { background:#fff; padding:calc(var(--u) * 6); box-shadow:0 1px 4px rgba(0,0,0,.18); width:calc(var(--u) * 192); }

  label { display:block; font-size:12px; color:#56616b; margin-top:10px; }
  input[type=text], input[type=date], textarea { display:block; width:100%; margin-top:3px; font-size:16px; padding:9px 10px;
         border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); font-family:inherit; }
  textarea { resize:vertical; line-height:1.6; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); }
  .chk input { width:20px; height:20px; }
  .note-s { font-size:11.5px; color:#7a858f; margin:6px 0 0; line-height:1.5; }
  .chips { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .chips button { border:1px solid var(--line); background:#f7f9fa; border-radius:16px; padding:6px 13px; font-size:13px; color:var(--text); }

  .fab { position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:6; border:none; border-radius:30px;
         background:var(--accent); color:#fff; font-size:15px; font-weight:700; padding:14px 18px; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .primary { background:var(--main) !important; color:#fff !important; border-color:var(--main) !important; }

  .modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:12px; }
  .modal[hidden] { display:none; }
  .modal.full { align-items:flex-start; padding:calc(env(safe-area-inset-top) + 8px) 8px 8px; }
  .modal-body { background:#fff; border-radius:14px; padding:12px 14px; width:100%; max-width:900px; max-height:100%; overflow:auto; }
  .modal-body.small { max-width:420px; }
  .modal-body.form { max-width:560px; padding-bottom:calc(env(safe-area-inset-bottom) + 14px); }
  .modal-body h3 { margin:4px 0 8px; font-size:17px; }
  .modal-body p { font-size:14px; line-height:1.6; margin:0 0 12px; word-break:break-all; }
  .modal-body section { border-top:1px solid var(--line); padding:10px 0 12px; }
  .modal-body section h2 { font-size:15px; margin:0 0 6px; }
  .mhead { display:flex; align-items:center; gap:8px; position:sticky; top:-12px; background:#fff; padding:6px 0; z-index:1; }
  .mhead h3 { flex:1; text-align:center; margin:0; }
  .mhead .btn { padding:8px 12px; }
  .cthumb { text-align:center; margin:6px 0 2px; }
  .cthumb img { max-width:100%; max-height:26vh; border-radius:8px; }
  #edCanvas { display:block; width:100%; height:auto; max-height:65vh; object-fit:contain; touch-action:none; background:#222; border-radius:8px; }
  .ed-ctl { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; }
  .ed-ctl label { margin:0; display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); }
  .ed-ctl input[type=range] { width:150px; }
  .ed-ctl .sp { flex:1; }
  .btn { font-size:15px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); }
  .btn.danger { color:#c0392b; }
  .btn.wide { display:block; width:100%; margin-top:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row .btn { flex:1; }
  .menu button { display:block; width:100%; text-align:left; margin-bottom:8px; }
  .menu .desc { display:block; font-size:12px; color:#7a858f; margin-top:2px; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(20,20,20,.88); color:#fff; padding:10px 16px;
           border-radius:10px; font-size:14px; z-index:30; max-width:90vw; display:none; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; font-size:16px; font-weight:600; }

  /* ===== 報告書のページ（画面表示とPDFで共通）。--u は 1mm に相当する長さ ===== */
  .page { width:calc(var(--u) * 180); height:calc(var(--u) * 276); display:flex; flex-direction:column; gap:calc(var(--u) * 3); background:#fff; overflow:hidden; }
  .blk { display:flex; gap:calc(var(--u) * 2.5); height:calc(var(--u) * 88); }
  .ph { position:relative; width:calc(var(--u) * 122); height:calc(var(--u) * 88); border:max(0.5px, calc(var(--u) * 0.3)) dashed #888;
        display:flex; align-items:center; justify-content:center; }
  .ph img { max-width:calc(100% - var(--u) * 3); max-height:calc(100% - var(--u) * 3); }
  .tx { position:relative; flex:1; height:calc(var(--u) * 88); display:grid; grid-template-rows:1.79fr repeat(9, 1fr);
        border:max(0.5px, calc(var(--u) * 0.35)) solid #555; }
  .tx div { display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; white-space:nowrap; min-width:0;
            border-top:max(0.5px, calc(var(--u) * 0.25)) solid #808080; color:#000;
            font-family:"Hiragino Kaku Gothic ProN","MS PGothic","Yu Gothic",sans-serif; font-size:calc(var(--u) * 3.2); padding:0 calc(var(--u) * 1); }
  .tx .t1 { font-size:calc(var(--u) * 4.2); white-space:normal; border-top:none; line-height:1.25; }
  .tx .t2 { font-size:calc(var(--u) * 3.7); border-top:max(0.5px, calc(var(--u) * 0.35)) solid #555; }
  .tx .faint { color:#a0a8b0; }
  .tap { cursor:pointer; -webkit-tap-highlight-color:rgba(47,125,91,.15); }
  .ph-hint { color:#8a959f; font-size:calc(var(--u) * 4.6); text-align:center; white-space:pre-line; line-height:1.5; }
  .tx-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre-line;
             color:#8a959f; font-size:calc(var(--u) * 3.6); line-height:1.5; background:rgba(255,255,255,.55); pointer-events:none; }

  /* ===== 印刷（PDF） ===== */
  #print { display:none; }
  @media print {
    @page { size:A4 portrait; margin:10mm 10mm 10mm 20mm; }
    body { background:#fff; }
    body > :not(#print) { display:none !important; }
    #print { display:block; --u:1mm; }
    #print .page { break-after:page; page-break-after:always; }
    #print .page:last-child { break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>
<header>
  <h1>写真報告書</h1>
  <span class="count" id="count"></span>
  <button id="btnMenu">☰ メニュー</button>
</header>

<main>
  <p class="guide">写真の枠をタップ → 撮影　／　右の欄をタップ → コメント入力</p>
  <div id="pages"></div>
</main>

<button class="fab" id="fab">📷 続けて撮影</button>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>

<!-- 写真の枠をタップしたとき -->
<div class="modal" id="slotMenu" hidden>
  <div class="modal-body small menu">
    <h3 id="smTitle"></h3>
    <div id="smBtns"></div>
  </div>
</div>

<!-- コメント入力 -->
<div class="modal full" id="cmt" hidden>
  <div class="modal-body form">
    <div class="mhead">
      <button class="btn" id="cPrev">◀ 前</button>
      <h3 id="cHead"></h3>
      <button class="btn" id="cNext">次 ▶</button>
    </div>
    <div class="cthumb"><img id="cImg" alt=""></div>
    <label>場所<input type="text" id="cLoc" placeholder="例：408室スクラバー"></label>
    <label>作業内容（1行ずつ改行・7行まで）<textarea id="cDesc" rows="7" placeholder="例：古いチューブの取外し&#10;※差圧計のH側、L側で各1本"></textarea></label>
    <div class="noteWrap">
      <label>黒板の備考<input type="text" id="cNote" placeholder="例：施工前"></label>
      <div class="chips" id="cChips"><button>施工前</button><button>施工中</button><button>施工後</button><button data-clear>クリア</button></div>
    </div>
    <section style="margin-top:14px">
      <h2 style="font-size:13px;color:#56616b">全ページ共通</h2>
      <div class="grid2">
        <label style="margin-top:0">作業名<input type="text" id="cTitle" placeholder="例：差圧計交換作業"></label>
        <label style="margin-top:0">日付<input type="date" id="cDate"></label>
      </div>
    </section>
    <button class="btn primary wide" id="cDone">完了</button>
  </div>
</div>

<!-- メニュー -->
<div class="modal full" id="menu" hidden>
  <div class="modal-body form menu">
    <div class="mhead"><h3 style="text-align:left">メニュー</h3><button class="btn" id="menuClose" style="width:auto;margin:0">✕ 閉じる</button></div>
    <section>
      <h2>出力</h2>
      <button class="btn" id="outXlsx">📊 Excelファイル（.xlsx）<span class="desc">報告書と同じレイアウト。あとで編集できます</span></button>
      <button class="btn" id="outPdf">📄 PDF（提出用）<span class="desc">印刷画面から保存します。LINEで送るときもこちら</span></button>
    </section>
    <section>
      <h2>報告書の情報（全ページ共通）</h2>
      <label>作業名<input type="text" id="mTitle" placeholder="例：差圧計交換作業"></label>
      <label>日付<input type="date" id="mDate"></label>
    </section>
    <section>
      <h2>電子黒板</h2>
      <label class="chk"><input type="checkbox" id="bUse"> 写真に黒板を入れる</label>
      <div class="grid2">
        <label>工事名<input type="text" id="bKoji" placeholder="例：○○ビル 空調設備保守"></label>
        <label>施工者<input type="text" id="bSekou" placeholder="例：○○設備(株)"></label>
      </div>
      <p class="note-s">黒板には「工事名・作業内容（作業名）・場所・備考・日付・施工者」のうち、入力した項目だけが表示されます。位置と大きさは、写真の枠をタップ →「黒板の位置・大きさ」で調整できます。</p>
    </section>
    <section>
      <button class="btn danger" id="btnNew">🗒 新しい報告書を始める<span class="desc">今の写真と入力内容を消します（工事名・施工者は残ります）</span></button>
    </section>
  </div>
</div>

<div class="modal" id="editor" hidden>
  <div class="modal-body">
    <canvas id="edCanvas"></canvas>
    <p class="note-s">黒板をドラッグして移動できます。写真の別の場所をタップするとそこへ移動します。</p>
    <div class="ed-ctl">
      <label><input type="checkbox" id="edOn"> 黒板を表示</label>
      <label>大きさ <input type="range" id="edSize" min="0.2" max="0.8" step="0.01"></label>
      <button class="btn" id="edReset">左下に戻す</button>
      <span class="sp"></span>
      <button class="btn primary" id="edClose">完了</button>
    </div>
  </div>
</div>

<div class="modal" id="ready" hidden>
  <div class="modal-body small">
    <h3 id="readyTitle"></h3>
    <p id="readyMsg"></p>
    <div class="row">
      <button class="btn primary" id="readyMain"></button>
      <button class="btn" id="readyDl">ダウンロード</button>
      <button class="btn" id="readyClose">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="busy">作成中…</div>
<div id="print"></div>

<script>
'use strict';
/* ================= 基本 ================= */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const jpDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${y}年${m}月${d}日`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const DESC_LINES = 7;           // Excelの説明欄（場所の下）の行数
const PER_PAGE = 3;
const SLOT_NAMES = ['上', '中', '下'];

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function busy(on, msg = '作成中…') { const b = $('#busy'); b.textContent = msg; b.style.display = on ? 'flex' : 'none'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ================= 保存（端末内のみ） ================= */
const META_KEY = 'photoReport.meta.v1';
const defaultMeta = () => ({ title: '', date: todayStr(), defLoc: '', board: { use: true, koji: '', sekou: '' } });
function loadMeta() {
  try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m) return Object.assign(defaultMeta(), m, { board: Object.assign(defaultMeta().board, m.board) }); } catch (e) {}
  return defaultMeta();
}
let meta = loadMeta();
const saveMeta = () => localStorage.setItem(META_KEY, JSON.stringify(meta));

let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('photoReport', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('photos', mode); const req = fn(t.objectStore('photos')); let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbPut = p => tx('readwrite', s => s.put(p));
const dbDel = id => tx('readwrite', s => s.delete(id));
const dbClear = () => tx('readwrite', s => s.clear());

/* 1件 = 報告書の1枠（写真＋コメント）。order が枠の番号（0=1ページ目の上, 1=中, 2=下, 3=2ページ目の上…）。
   空いた枠もそのまま残るので、画面で見た並びのまま出力される */
let photos = [];
const saveLater = new Map();
function savePhoto(p) {
  clearTimeout(saveLater.get(p.id));
  saveLater.set(p.id, setTimeout(() => dbPut(p).catch(e => toast('保存に失敗しました: ' + e.message)), 300));
}
const bySlot = s => photos.find(p => p.order === s);
const slotLabel = s => `${Math.floor(s / PER_PAGE) + 1}ページ目・${SLOT_NAMES[s % PER_PAGE]}`;
const lastSlot = () => photos.reduce((m, p) => Math.max(m, p.order), -1);
const usedPages = () => lastSlot() < 0 ? 0 : Math.floor(lastSlot() / PER_PAGE) + 1;
const nextFreeSlot = () => photos.reduce((m, p) => p.blob ? Math.max(m, p.order) : m, -1) + 1;
// 出力するページ（中身が1つもないページは飛ばす）
const outPageIdx = () => { const r = []; for (let pi = 0; pi < usedPages(); pi++) if ([0, 1, 2].some(b => bySlot(pi * PER_PAGE + b))) r.push(pi); return r; };
function prevLoc(s) {
  let best = null;
  for (const p of photos) if (p.order < s && p.loc && (!best || p.order > best.order)) best = p;
  return best ? best.loc : (meta.defLoc || '');
}
function ensureRec(s) {
  let p = bySlot(s);
  if (!p) {
    p = { id: uid(), order: s, blob: null, w: 0, h: 0, rot: 0, loc: prevLoc(s), desc: '', note: '',
          board: { on: true, x: null, y: null, s: 0.42 } };
    photos.push(p); savePhoto(p);
  }
  return p;
}
async function removeRec(p) {
  photos = photos.filter(x => x !== p); clearTimeout(saveLater.get(p.id));
  imgCache.delete(p.id); dropThumb(p); await dbDel(p.id);
}
// 写真もコメントも入っていない枠は消す
async function dropIfEmpty(s) {
  const p = bySlot(s);
  if (p && !p.blob && !(p.desc || '').trim() && !(p.note || '').trim() && (p.loc || '') === prevLoc(s)) await removeRec(p);
}

/* ================= 画像 ================= */
const imgCache = new Map();
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を開けません')); i.src = src; });
}
async function getImg(p) {
  if (!imgCache.has(p.id)) imgCache.set(p.id, loadImg(URL.createObjectURL(p.blob)));
  return imgCache.get(p.id);
}
// 撮影画像を長辺1800pxのJPEGに縮小して保存（向きはブラウザが補正）
async function normalizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const MAX = 1800;
    const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}

/* ================= 電子黒板 ================= */
const BOARD_FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
function boardRows(p) {
  return [
    ['工事名', meta.board.koji], ['作業内容', meta.title], ['場所', p.loc],
    ['備考', p.note], ['日付', jpDate(meta.date)], ['施工者', meta.board.sekou],
  ].filter(r => r[1] && String(r[1]).trim());
}
function boardRect(p, W, H) {
  const n = Math.max(1, boardRows(p).length);
  const bw = Math.min(W * 0.96, p.board.s * Math.min(W, H) * 1.2);
  const rh = bw * 0.12, bh = Math.min(H * 0.96, n * rh);
  const x = p.board.x == null ? W * 0.02 : clamp(p.board.x * W, 0, W - bw);
  const y = p.board.y == null ? H - bh - H * 0.02 : clamp(p.board.y * H, 0, H - bh);
  return { x, y, w: bw, h: bh, rh: bh / n };
}
function fitText(g, t, x, y, maxW, size, align) {
  let s = size; g.font = `600 ${s}px ${BOARD_FONT}`;
  let m = g.measureText(t).width;
  if (m > maxW) { s = Math.max(size * 0.5, s * maxW / m); g.font = `600 ${s}px ${BOARD_FONT}`; m = g.measureText(t).width; }
  g.textAlign = align;
  if (m > maxW) { g.save(); g.translate(x, y); g.scale(maxW / m, 1); g.fillText(t, 0, 0); g.restore(); }
  else g.fillText(t, x, y);
}
function drawBoard(g, W, H, p) {
  const rows = boardRows(p); if (!rows.length) return;
  const r = boardRect(p, W, H);
  g.save();
  g.fillStyle = '#24493b'; g.fillRect(r.x, r.y, r.w, r.h);
  const lw = Math.max(1.5, r.w * 0.008);
  g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = lw;
  g.strokeRect(r.x + lw / 2, r.y + lw / 2, r.w - lw, r.h - lw);
  const lab = r.w * 0.26;
  g.lineWidth = Math.max(1, lw * 0.55);
  g.beginPath(); g.moveTo(r.x + lab, r.y); g.lineTo(r.x + lab, r.y + r.h);
  for (let i = 1; i < rows.length; i++) { g.moveTo(r.x, r.y + i * r.rh); g.lineTo(r.x + r.w, r.y + i * r.rh); }
  g.stroke();

      const bytes = new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85))).arrayBuffer());
      imgNo++; media.push({ name: `xl/media/image${imgNo}.jpeg`, data: bytes });
      const k = Math.min((BOX_W - 16) / cv.width, (BOX_H - 16) / cv.height);
      const w = Math.round(cv.width * k), h = Math.round(cv.height * k);
      const x = COL_PX[0] + (BOX_W - w) / 2, y = sumTo(ROW_PX, top - 1) + (BOX_H - h) / 2;
      const f1 = locate(COL_PX, x), f2 = locate(COL_PX, x + w), r1 = locate(ROW_PX, y), r2 = locate(ROW_PX, y + h);
      const rid = `rId${drawRels.length + 1}`, n = anchors.length + 1;
      drawRels.push(`<Relationship Id="${rid}" Type="${NSR}/image" Target="../media/image${imgNo}.jpeg"/>`);
      anchors.push(
        '<xdr:twoCellAnchor editAs="oneCell">' +
        `<xdr:from><xdr:col>${f1.i}</xdr:col><xdr:colOff>${EMU(f1.off)}</xdr:colOff><xdr:row>${r1.i}</xdr:row><xdr:rowOff>${EMU(r1.off)}</xdr:rowOff></xdr:from>` +
        `<xdr:to><xdr:col>${f2.i}</xdr:col><xdr:colOff>${EMU(f2.off)}</xdr:colOff><xdr:row>${r2.i}</xdr:row><xdr:rowOff>${EMU(r2.off)}</xdr:rowOff></xdr:to>` +
        `<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n + 1}" name="図 ${n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
        `<xdr:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
        `<xdr:spPr><a:xfrm><a:off x="${EMU(x)}" y="${EMU(y)}"/><a:ext cx="${EMU(w)}" cy="${EMU(h)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>` +
        '</xdr:pic><xdr:clientData/></xdr:twoCellAnchor>');
    }
    let rowsXml = `<row r="1" ht="13.5" customHeight="1"/>`;
    for (let r = 2; r <= 33; r++) {
      rowsXml += `<row r="${r}" ht="${ROW_PT[r - 1]}" customHeight="1">${(rows.get(r) || []).join('')}</row>`;
    }
    const sn = pi + 1;
    files.push({ name: `xl/worksheets/sheet${sn}.xml`, data: HEAD +
      `<worksheet xmlns="${NS}" xmlns:r="${NSR}"><dimension ref="B2:F33"/>` +
      `<sheetViews><sheetView showGridLines="0"${pi === 0 ? ' tabSelected="1"' : ''} workbookViewId="0"/></sheetViews>` +
      '<sheetFormatPr defaultRowHeight="13.5"/>' +
      `<cols>${COLS.map(([c, w]) => `<col min="${c}" max="${c}" width="${w}" customWidth="1"/>`).join('')}</cols>` +
      `<sheetData>${rowsXml}</sheetData>` +
      `<mergeCells count="${PER_PAGE}">${Array.from({ length: PER_PAGE }, (_, b) => `<mergeCell ref="B${2 + b * 11}:D${11 + b * 11}"/>`).join('')}</mergeCells>` +
      '<pageMargins left="0.787" right="0.394" top="0.394" bottom="0.394" header="0.512" footer="0.512"/>' +
      '<pageSetup paperSize="9" scale="75" orientation="portrait"/>' +
      (anchors.length ? '<drawing r:id="rId1"/>' : '') + '</worksheet>' });
    if (anchors.length) {
      files.push({ name: `xl/worksheets/_rels/sheet${sn}.xml.rels`, data: HEAD +
        `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NSR}/drawing" Target="../drawings/drawing${sn}.xml"/></Relationships>` });
      files.push({ name: `xl/drawings/drawing${sn}.xml`, data: HEAD +
        `<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${NSR}">${anchors.join('')}</xdr:wsDr>` });
      files.push({ name: `xl/drawings/_rels/drawing${sn}.xml.rels`, data: HEAD +
        `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drawRels.join('')}</Relationships>` });
    }
  }
  const n = sheetNames.length;
  const hasDrawing = i => files.some(f => f.name === `xl/drawings/drawing${i}.xml`);
  const head = [
    { name: '[Content_Types].xml', data: HEAD +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheetNames.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
        (hasDrawing(i + 1) ? `<Override PartName="/xl/drawings/drawing${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>` : '')).join('') +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' +
      '</Types>' },
    { name: '_rels/.rels', data: HEAD +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NSR}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: HEAD +
      `<workbook xmlns="${NS}" xmlns:r="${NSR}"><bookViews><workbookView/></bookViews><sheets>` +
      sheetNames.map((s, i) => `<sheet name="${s}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets><definedNames>' +
      sheetNames.map((s, i) => `<definedName name="_xlnm.Print_Area" localSheetId="${i}">'${s}'!$B$2:$F$33</definedName>`).join('') +
      '</definedNames></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', data: HEAD +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheetNames.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${NSR}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `<Relationship Id="rId${n + 1}" Type="${NSR}/styles" Target="styles.xml"/>` +
      `<Relationship Id="rId${n + 2}" Type="${NSR}/sharedStrings" Target="sharedStrings.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: st.xml() },
    { name: 'xl/sharedStrings.xml', data: HEAD +
      `<sst xmlns="${NS}" count="${sst.length}" uniqueCount="${sst.length}">` +
      sst.map(s => `<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join('') + '</sst>' },
  ];
  return zipStore([...head, ...files, ...media]);
}
window.buildXlsx = buildXlsx; // 動作確認用

function fileBaseName() {
  const d = (meta.date || todayStr()).replace(/-/g, '');
  const t = (meta.title || '写真報告書').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
  return `${d}_${t}`;
}

/* ================= PDF（印刷） ================= */
async function buildPrint() {
  const root = $('#print'); root.innerHTML = '';
  const jobs = [];
  for (const pi of outPageIdx()) {
    root.appendChild(pageEl(pi, false, (p, im) => jobs.push(compose(p, 1400).then(cv => {
      im.src = cv.toDataURL('image/jpeg', 0.85);
      return im.decode ? im.decode().catch(() => {}) : null;
    }))));
  }
  await Promise.all(jobs);
}

/* ================= 出力 ================= */
let readyFile = null;
function showReady(title, msg, mainLabel, onMain, file) {
  readyFile = file;
  $('#readyTitle').textContent = title; $('#readyMsg').textContent = msg;
  $('#readyMain').textContent = mainLabel; $('#readyMain').onclick = onMain;
  $('#readyDl').style.display = file ? '' : 'none';
  $('#ready').hidden = false;
}
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function shareFile(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); }
    catch (e) { if (e.name !== 'AbortError') { toast('共有できなかったのでダウンロードします'); download(file); } }
  } else download(file);
}
function canOutput() {
  if (outPageIdx().length) return true;
  toast('写真やコメントがまだありません'); return false;
}
$('#outXlsx').addEventListener('click', async () => {
  if (!canOutput()) return;
  $('#menu').hidden = true; busy(true, 'Excelを作成中…');
  try {
    const blob = await buildXlsx();
    const file = new File([blob], fileBaseName() + '.xlsx', { type: XLSX_MIME });
    busy(false);
    showReady('Excelができました', `${file.name}（${(file.size / 1024 / 1024).toFixed(1)}MB）`,
      '共有・保存', () => shareFile(file), file);
  } catch (e) { busy(false); alert('Excelの作成に失敗しました。\n' + e.message); }
});
$('#outPdf').addEventListener('click', async () => {
  if (!canOutput()) return;
  $('#menu').hidden = true; busy(true, 'PDF用の画面を準備中…');
  try {
    await buildPrint(); busy(false);
    showReady('PDFの準備ができました', '「印刷」を押し、印刷画面の共有ボタン（iPhone/iPad）または「PDFに保存」（パソコン）で保存してください。',
      '印刷 / PDF保存', () => { $('#ready').hidden = true; window.print(); }, null);
  } catch (e) { busy(false); alert('PDFの準備に失敗しました。\n' + e.message); }
});
$('#readyDl').addEventListener('click', () => readyFile && download(readyFile));
$('#readyClose').addEventListener('click', () => { $('#ready').hidden = true; });

/* ================= メニュー ================= */
function applyBoardVisibility() {
  document.querySelectorAll('.noteWrap').forEach(e => e.style.display = meta.board.use ? '' : 'none');
}
function bindMeta() {
  // 作業名・日付はメニューとコメント入力の両方にある
  [['#mTitle', 'title'], ['#cTitle', 'title'], ['#mDate', 'date'], ['#cDate', 'date']].forEach(([sel, key]) => {
    $(sel).addEventListener('input', e => { meta[key] = e.target.value; saveMeta(); refreshAll(); });
  });
  [['#bKoji', 'koji'], ['#bSekou', 'sekou']].forEach(([sel, key]) => {
    const e = $(sel); e.value = meta.board[key] || '';
    e.addEventListener('input', () => { meta.board[key] = e.value; saveMeta(); refreshAll(); });
  });
  $('#bUse').checked = meta.board.use;
  $('#bUse').addEventListener('change', e => { meta.board.use = e.target.checked; saveMeta(); applyBoardVisibility(); refreshAll(); });
  applyBoardVisibility();
}
$('#btnMenu').addEventListener('click', () => {
  $('#mTitle').value = meta.title || ''; $('#mDate').value = meta.date || '';
  $('#menu').hidden = false;
});
$('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
$('#btnNew').addEventListener('click', async () => {
  if (!confirm('今の写真と入力内容を消して、新しい報告書を始めますか？\n（工事名・施工者の設定は残ります）\n\n消す前に、必要ならExcelかPDFで出力しておいてください。')) return;
  await dbClear(); photos.forEach(dropThumb); photos = []; imgCache.clear();
  meta = Object.assign(defaultMeta(), { board: meta.board }); saveMeta();
  $('#mTitle').value = ''; $('#mDate').value = meta.date;
  $('#menu').hidden = true; renderPages(); window.scrollTo(0, 0);
  toast('新しい報告書を始めました');
});

/* ================= 起動 ================= */
(async function init() {
  bindMeta(); fitPages();
  window.addEventListener('resize', debounce(fitPages, 100));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try {
    photos = (await dbAll()).sort((a, b) => a.order - b.order);
  } catch (e) { toast('保存データを読めませんでした: ' + e.message); }
  renderPages();
})();
</script>
</body>
